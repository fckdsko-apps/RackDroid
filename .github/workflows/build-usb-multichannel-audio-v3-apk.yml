name: Build USB Multichannel Audio v3 APK

on:
  workflow_dispatch:
  push:
    branches:
      - android-file-picker
    paths:
      - ".github/workflows/build-usb-multichannel-audio-v3-apk.yml"

permissions:
  contents: read

jobs:
  build-arm64-apk:
    name: Build USB Multichannel Audio v3 arm64 APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Verify v2 test ancestry
        shell: bash
        run: |
          set -euo pipefail
          BASELINE="64ead601a2767b5ec278cd3f2d55fa6229930d9c"
          test "${GITHUB_REF_NAME}" = "android-file-picker"
          git merge-base --is-ancestor "${BASELINE}" HEAD
          test -s .github/workflows/build-usb-multichannel-audio-apk.yml
          test -s .github/workflows/build-usb-multichannel-audio-v2-apk.yml

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Reproduce exact v1 USB multichannel patch
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "import base64; exec(compile(base64.b64decode(''), '<usb-multichannel-v1>', 'exec'))"

      - name: Reproduce exact v2 start/share fix
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "import base64; exec(compile(base64.b64decode(''), '<usb-multichannel-v2>', 'exec'))"

      - name: Apply v3 full-duplex USB pairing fix
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "import base64; exec(compile(base64.b64decode(''), '<usb-multichannel-v3>', 'exec'))"

      - name: Validate v3 routing behavior
        shell: bash
        run: |
          set -euo pipefail

          # Phone/default performance baseline stays untouched.
          grep -Fq 'static const int RECOMMENDED_CALLBACK_FRAMES = 192;' native/port/audio_oboe.cpp
          grep -Fq 'static const int RECOMMENDED_SAMPLE_RATE_MODE = 0;' native/port/audio_oboe.cpp
          grep -Fq 'static const int RECOMMENDED_BUFFER_BURSTS = 3;' native/port/audio_oboe.cpp

          # USB input/output halves are paired by address rather than type/name.
          grep -Fq 'key = "address|" + raw.address;' native/port/audio_oboe.cpp
          ! grep -Fq 'std::to_string(raw.type) + "|" + raw.address + "|" + product' native/port/audio_oboe.cpp

          # Explicit USB gets its physical IDs and USB-only Shared mode.
          grep -Fq 'setDeviceId(selectedDevice.outputDeviceId)' native/port/audio_oboe.cpp
          grep -Fq 'setDeviceId(selectedDevice.inputDeviceId)' native/port/audio_oboe.cpp
          grep -Fq 'selectedDevice.explicitUsb' native/port/audio_oboe.cpp
          grep -Fq '? oboe::SharingMode::Shared' native/port/audio_oboe.cpp

          # requestStart errors remain visible after a failed stream is closed.
          grep -Fq 'last output requestStart result:' native/port/audio_oboe.cpp
          grep -Fq 'Connected Android USB endpoints' native/port/audio_oboe.cpp

          # Core Audio-2/8/16 remain untouched and inherit the shared driver.
          git diff --quiet -- third_party/Rack/src/core/Audio.cpp

          python3 <<'PY'
          import subprocess
          allowed = {
              "native/port/audio_oboe.cpp",
              "native/port/jni_bridge.cpp",
              "native/port/jni_bridge.hpp",
          }
          changed = set(
              subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          )
          if changed != allowed:
              print("ERROR: unexpected v3 changed-file set")
              print("Expected:", sorted(allowed))
              print("Actual:", sorted(changed))
              raise SystemExit(1)
          print("Isolation passed: Android audio driver/JNI only.")
          PY

          git diff --check
          git diff --             native/port/audio_oboe.cpp             native/port/jni_bridge.cpp             native/port/jni_bridge.hpp             > RackDroid-USB-Multichannel-Audio-v3.patch
          test -s RackDroid-USB-Multichannel-Audio-v3.patch

      - name: Build development-signed USB Multichannel Audio v3 APK
        run: >-
          ./gradlew assembleSideloadRelease
          -PdevKeystore -PtargetAbis=arm64-v8a --no-daemon

      - name: Package v3 test build
        id: package
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/sideload/release/app-sideload-release.apk"
          test -s "${APK}"
          unzip -t "${APK}" >/dev/null

          SHORT_SHA="$(git rev-parse --short=7 HEAD)"
          OUT="RackDroid-usb-multichannel-audio-v3-${SHORT_SHA}.apk"
          cp "${APK}" "${OUT}"
          echo "apk=${OUT}" >> "${GITHUB_OUTPUT}"

          sha256sum "${OUT}" RackDroid-USB-Multichannel-Audio-v3.patch             > RackDroid-usb-multichannel-audio-v3-SHA256.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: RackDroid-usb-multichannel-audio-v3-${{ github.sha }}
          path: |
            ${{ steps.package.outputs.apk }}
            RackDroid-USB-Multichannel-Audio-v3.patch
            RackDroid-usb-multichannel-audio-v3-SHA256.txt
          if-no-files-found: error
