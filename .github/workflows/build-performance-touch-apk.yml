name: Build Performance Touch APK

on:
  workflow_dispatch:
  push:
    branches:
      - android-file-picker
    paths:
      - ".github/workflows/build-performance-touch-apk.yml"

permissions:
  contents: read

jobs:
  build-arm64-apk:
    name: Build Performance Touch arm64 APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Verify RackDroid baseline
        run: |
          set -euo pipefail
          BASELINE="367c3425affbab8aabdbb6a35ed399915b663bea"
          git merge-base --is-ancestor "${BASELINE}" HEAD
          test "${GITHUB_REF_NAME}" = "android-file-picker"

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Add Performance Touch
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one anchor, found {count}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          cpp = Path("native/port/touch_input.cpp")
          text = cpp.read_text(encoding="utf-8")

          include_anchor = "#include <app/ModuleWidget.hpp>\n#include <app/PortWidget.hpp>\n"
          include_new = (
              "#include <app/ModuleWidget.hpp>\n"
              "#include <app/Knob.hpp>\n"
              "#include <app/Switch.hpp>\n"
              "#include <app/PortWidget.hpp>\n"
          )
          if text.count(include_anchor) != 1:
              raise SystemExit("touch includes: anchor changed")
          text = text.replace(include_anchor, include_new, 1)

          logger_anchor = "#include <logger.hpp>\n"
          logger_new = "#include <logger.hpp>\n#include <history.hpp>\n#include <settings.hpp>\n"
          if text.count(logger_anchor) != 1:
              raise SystemExit("touch Rack includes: anchor changed")
          text = text.replace(logger_anchor, logger_new, 1)

          touch_anchor = "\n\nint touchHandleEvent(AInputEvent* event) {\n"
          if text.count(touch_anchor) != 1:
              raise SystemExit("touchHandleEvent anchor changed")

          perf_code = r'''

          // ------------------------------------------------------------------
          // Performance Touch
          //
          // Rack's EventState owns one mouse drag. Normal RackDroid therefore
          // converts a second finger into pan/zoom and ends the first drag.
          // This mode captures Android pointer IDs directly so several fingers
          // can own several performance controls simultaneously. Background
          // pointers remain navigation. Editing gestures stay on the original
          // single-pointer path when they begin on modules, ports or cables.
          //
          // This is UI-only. It does not touch Oboe, callback sizing, buffering,
          // sample rate or any other validated audio-path code.
          // ------------------------------------------------------------------

          static std::atomic<bool> performanceTouch{false};

          enum class PerfKind {
              NONE,
              KNOB,
              SWITCH,
              PAN
          };

          struct PerfPointer {
              bool active = false;
              int32_t id = -1;
              PerfKind kind = PerfKind::NONE;
              rack::app::Knob* knob = NULL;
              rack::app::Switch* sw = NULL;
              rack::engine::ParamQuantity* quantity = NULL;
              rack::math::Vec lastPos;
              float oldValue = NAN;
              float snapDelta = 0.f;
          };

          static PerfPointer perfPointers[32];
          static bool perfSession = false;
          static bool perfPanGeometryValid = false;
          static rack::math::Vec perfPanCentroid;
          static float perfPanDistance = 0.f;

          static PerfPointer* perfFind(int32_t id) {
              for (PerfPointer& p : perfPointers) {
                  if (p.active && p.id == id)
                      return &p;
              }
              return NULL;
          }

          static PerfPointer* perfAlloc(int32_t id) {
              if (PerfPointer* existing = perfFind(id))
                  return existing;
              for (PerfPointer& p : perfPointers) {
                  if (!p.active) {
                      p = PerfPointer();
                      p.active = true;
                      p.id = id;
                      return &p;
                  }
              }
              return NULL;
          }

          static rack::app::Knob* perfHoveredKnob() {
              for (rack::widget::Widget* w = APP->event->hoveredWidget; w; w = w->parent) {
                  if (auto* knob = dynamic_cast<rack::app::Knob*>(w))
                      return knob;
              }
              return NULL;
          }

          static rack::app::Switch* perfHoveredSwitch() {
              for (rack::widget::Widget* w = APP->event->hoveredWidget; w; w = w->parent) {
                  if (auto* sw = dynamic_cast<rack::app::Switch*>(w))
                      return sw;
              }
              return NULL;
          }

          static void perfPushHistory(rack::app::ParamWidget* widget,
                  rack::engine::ParamQuantity* quantity, float oldValue) {
              if (!widget || !quantity || !APP->history || !widget->module ||
                      !std::isfinite(oldValue))
                  return;
              float newValue = quantity->getValue();
              if (oldValue == newValue)
                  return;

              rack::history::ParamChange* h = new rack::history::ParamChange;
              h->name = "Performance touch";
              h->moduleId = widget->module->id;
              h->paramId = widget->paramId;
              h->oldValue = oldValue;
              h->newValue = newValue;
              APP->history->push(h);
          }

          static void perfFinishPointer(PerfPointer& p, bool pushHistory) {
              if (p.kind == PerfKind::KNOB && p.knob && p.quantity) {
                  if (pushHistory)
                      perfPushHistory(p.knob, p.quantity, p.oldValue);
              }
              else if (p.kind == PerfKind::SWITCH && p.sw && p.quantity) {
                  if (p.sw->momentary) {
                      // A held performance button must never stick high if the
                      // finger lifts, the gesture is cancelled, or the mode is
                      // toggled off from the Android toolbar.
                      p.quantity->setMin();
                  }
                  else if (pushHistory) {
                      perfPushHistory(p.sw, p.quantity, p.oldValue);
                  }
              }
              p = PerfPointer();
          }

          static void perfFinishAll(bool pushHistory) {
              for (PerfPointer& p : perfPointers) {
                  if (p.active)
                      perfFinishPointer(p, pushHistory);
              }
              perfSession = false;
              perfPanGeometryValid = false;
          }

          static bool perfEventPos(AInputEvent* event, int32_t id, rack::math::Vec& out) {
              const size_t n = AMotionEvent_getPointerCount(event);
              for (size_t i = 0; i < n; i++) {
                  if (AMotionEvent_getPointerId(event, i) == id) {
                      out = scenePos(AMotionEvent_getX(event, i), AMotionEvent_getY(event, i));
                      return true;
                  }
              }
              return false;
          }

          static void perfPrimePanGeometry(AInputEvent* event) {
              rack::math::Vec a;
              rack::math::Vec b;
              int found = 0;

              for (PerfPointer& p : perfPointers) {
                  if (!p.active || p.kind != PerfKind::PAN)
                      continue;
                  rack::math::Vec pos;
                  if (!perfEventPos(event, p.id, pos))
                      continue;
                  p.lastPos = pos;
                  if (found == 0)
                      a = pos;
                  else if (found == 1)
                      b = pos;
                  found++;
              }

              if (found >= 2) {
                  perfPanCentroid = a.plus(b).mult(0.5f);
                  perfPanDistance = a.minus(b).norm();
                  perfPanGeometryValid = true;
              }
              else {
                  perfPanGeometryValid = false;
                  perfPanDistance = 0.f;
              }
          }

          static bool perfBeginPointer(AInputEvent* event, size_t index) {
              if (index >= AMotionEvent_getPointerCount(event))
                  return false;

              const int32_t id = AMotionEvent_getPointerId(event, index);
              PerfPointer* p = perfAlloc(id);
              if (!p)
                  return false;

              rack::math::Vec pos = scenePos(
                  AMotionEvent_getX(event, index),
                  AMotionEvent_getY(event, index));

              APP->event->handleHover(pos, rack::math::Vec());

              if (lockMode.load(std::memory_order_relaxed) < 2) {
                  if (rack::app::Knob* knob = perfHoveredKnob()) {
                      if (rack::engine::ParamQuantity* q = knob->getParamQuantity()) {
                          p->kind = PerfKind::KNOB;
                          p->knob = knob;
                          p->quantity = q;
                          p->lastPos = pos;
                          p->oldValue = q->getValue();
                          p->snapDelta = 0.f;
                          if (APP->scene && APP->scene->rack)
                              APP->scene->rack->touchedParam = knob;
                          APP->event->handleLeave();
                          return true;
                      }
                  }

                  if (rack::app::Switch* sw = perfHoveredSwitch()) {
                      if (rack::engine::ParamQuantity* q = sw->getParamQuantity()) {
                          p->kind = PerfKind::SWITCH;
                          p->sw = sw;
                          p->quantity = q;
                          p->lastPos = pos;
                          p->oldValue = q->getValue();

                          if (sw->momentary) {
                              q->setMax();
                          }
                          else if (q->isMax()) {
                              q->setMin();
                          }
                          else {
                              q->setValue(std::round(q->getValue()) + 1.f);
                          }

                          if (APP->scene && APP->scene->rack)
                              APP->scene->rack->touchedParam = sw;
                          APP->event->handleLeave();
                          return true;
                      }
                  }
              }

              if (!overInteractive()) {
                  p->kind = PerfKind::PAN;
                  p->lastPos = pos;
                  APP->event->handleLeave();
                  return true;
              }

              if (PerfPointer* unused = perfFind(id))
                  perfFinishPointer(*unused, false);
              APP->event->handleLeave();
              return false;
          }

          static void perfMoveKnob(PerfPointer& p, rack::math::Vec pos) {
              if (!p.knob || !p.quantity)
                  return;

              rack::math::Vec motion = pos.minus(p.lastPos);
              p.lastPos = pos;
              if (motion.norm() <= 0.f)
                  return;

              // Rack's rotary modes depend on one global mouse position. For
              // independent fingers use Rack's linear drag sensitivity instead.
              float delta = p.knob->horizontal ? motion.x : -motion.y;
              delta *= rack::settings::knobLinearSensitivity;
              delta *= p.knob->speed;

              float rangeRatio = 1.f;
              if (p.quantity->isBounded()) {
                  float angularTurns =
                      (p.knob->maxAngle - p.knob->minAngle) / float(2.0 * M_PI);
                  if (std::fabs(angularTurns) > 1e-6f)
                      rangeRatio = p.quantity->getRange() / angularTurns;
              }
              delta *= rangeRatio;

              if (p.quantity->snapEnabled) {
                  p.snapDelta += delta;
                  delta = std::trunc(p.snapDelta);
                  p.snapDelta -= delta;
              }

              p.quantity->setValue(p.quantity->getValue() + delta);
          }

          static bool handlePerformanceTouch(AInputEvent* event,
                  int32_t action, int32_t actionMasked, size_t pointerCount) {
              if (!performanceTouch.load(std::memory_order_relaxed))
                  return false;

              // These modes deliberately own the whole canvas. Do not blend
              // them with Performance Touch.
              if (multiSelect.load(std::memory_order_relaxed) ||
                      lockMode.load(std::memory_order_relaxed) >= 2) {
                  if (perfSession)
                      perfFinishAll(true);
                  return false;
              }

              size_t actionIndex = 0;
              if (actionMasked == AMOTION_EVENT_ACTION_POINTER_DOWN ||
                      actionMasked == AMOTION_EVENT_ACTION_POINTER_UP) {
                  actionIndex =
                      (action & AMOTION_EVENT_ACTION_POINTER_INDEX_MASK) >>
                      AMOTION_EVENT_ACTION_POINTER_INDEX_SHIFT;
                  if (actionIndex >= pointerCount)
                      actionIndex = 0;
              }

              if (actionMasked == AMOTION_EVENT_ACTION_DOWN) {
                  if (perfSession)
                      perfFinishAll(true);
                  if (perfBeginPointer(event, 0)) {
                      perfSession = true;
                      perfPrimePanGeometry(event);
                      return true;
                  }
                  return false;
              }

              if (!perfSession)
                  return false;

              if (actionMasked == AMOTION_EVENT_ACTION_POINTER_DOWN) {
                  // If a performance gesture already exists, the new pointer
                  // may add another control or background navigation. A touch
                  // on a cable/module is ignored rather than creating a second
                  // global Rack mouse drag.
                  perfBeginPointer(event, actionIndex);
                  perfPrimePanGeometry(event);
                  return true;
              }

              if (actionMasked == AMOTION_EVENT_ACTION_MOVE) {
                  PerfPointer* panPtrs[2] = {NULL, NULL};
                  rack::math::Vec panPos[2];
                  int panCount = 0;

                  for (size_t i = 0; i < pointerCount; i++) {
                      int32_t id = AMotionEvent_getPointerId(event, i);
                      PerfPointer* p = perfFind(id);
                      if (!p)
                          continue;
                      rack::math::Vec current = scenePos(
                          AMotionEvent_getX(event, i),
                          AMotionEvent_getY(event, i));

                      if (p->kind == PerfKind::KNOB) {
                          perfMoveKnob(*p, current);
                      }
                      else if (p->kind == PerfKind::PAN) {
                          if (panCount < 2) {
                              panPtrs[panCount] = p;
                              panPos[panCount] = current;
                          }
                          panCount++;
                      }
                  }

                  if (panCount == 1 && panPtrs[0]) {
                      rack::math::Vec delta = panPos[0].minus(panPtrs[0]->lastPos);
                      if (delta.norm() > 0.f)
                          APP->event->handleScroll(panPos[0], delta);
                      perfPanGeometryValid = false;
                  }
                  else if (panCount >= 2 && panPtrs[0] && panPtrs[1]) {
                      rack::math::Vec centroid = panPos[0].plus(panPos[1]).mult(0.5f);
                      float distance = panPos[0].minus(panPos[1]).norm();

                      if (perfPanGeometryValid) {
                          if (perfPanDistance > 0.f) {
                              float ratio = distance / perfPanDistance - 1.f;
                              if (std::fabs(ratio) > PINCH_DETECT_RATIO) {
                                  windowSetMods(GLFW_MOD_CONTROL);
                                  APP->event->handleScroll(
                                      centroid,
                                      rack::math::Vec(
                                          0.f,
                                          ratio * PINCH_ZOOM_SPEED * 50.f));
                                  windowSetMods(0);
                              }
                          }

                          rack::math::Vec delta = centroid.minus(perfPanCentroid);
                          if (delta.norm() > 0.f)
                              APP->event->handleScroll(centroid, delta);
                      }

                      perfPanCentroid = centroid;
                      perfPanDistance = distance;
                      perfPanGeometryValid = true;
                  }

                  // Update pan baselines after calculating this frame's motion.
                  for (size_t i = 0; i < pointerCount; i++) {
                      int32_t id = AMotionEvent_getPointerId(event, i);
                      PerfPointer* p = perfFind(id);
                      if (!p || p->kind != PerfKind::PAN)
                          continue;
                      p->lastPos = scenePos(
                          AMotionEvent_getX(event, i),
                          AMotionEvent_getY(event, i));
                  }
                  return true;
              }

              if (actionMasked == AMOTION_EVENT_ACTION_POINTER_UP) {
                  int32_t id = AMotionEvent_getPointerId(event, actionIndex);
                  if (PerfPointer* p = perfFind(id))
                      perfFinishPointer(*p, true);
                  perfPrimePanGeometry(event);
                  return true;
              }

              if (actionMasked == AMOTION_EVENT_ACTION_UP) {
                  int32_t id = AMotionEvent_getPointerId(event, 0);
                  if (PerfPointer* p = perfFind(id))
                      perfFinishPointer(*p, true);
                  perfFinishAll(true);
                  APP->event->handleLeave();
                  return true;
              }

              if (actionMasked == AMOTION_EVENT_ACTION_CANCEL) {
                  perfFinishAll(true);
                  APP->event->handleLeave();
                  return true;
              }

              return true;
          }
          '''

          text = text.replace(touch_anchor, perf_code + touch_anchor, 1)

          dispatch_anchor = (
              "\tsize_t pointerCount = AMotionEvent_getPointerCount(event);\n\n"
              "\track::math::Vec pos = scenePos(AMotionEvent_getX(event, 0), "
              "AMotionEvent_getY(event, 0));\n"
          )
          dispatch_new = (
              "\tsize_t pointerCount = AMotionEvent_getPointerCount(event);\n\n"
              "\tif (handlePerformanceTouch(event, action, actionMasked, pointerCount))\n"
              "\t\treturn 1;\n\n"
              "\track::math::Vec pos = scenePos(AMotionEvent_getX(event, 0), "
              "AMotionEvent_getY(event, 0));\n"
          )
          if text.count(dispatch_anchor) != 1:
              raise SystemExit("performance dispatch anchor changed")
          text = text.replace(dispatch_anchor, dispatch_new, 1)

          step_anchor = (
              "void touchStep() {\n"
              "\tif (!APP->event || !APP->window)\n"
              "\t\treturn;\n\n"
          )
          step_new = (
              "void touchStep() {\n"
              "\tif (!APP->event || !APP->window)\n"
              "\t\treturn;\n\n"
              "\tif (perfSession && (!performanceTouch.load(std::memory_order_relaxed) ||\n"
              "\t\t\tmultiSelect.load(std::memory_order_relaxed) ||\n"
              "\t\t\tlockMode.load(std::memory_order_relaxed) >= 2)) {\n"
              "\t\tperfFinishAll(true);\n"
              "\t}\n\n"
          )
          if text.count(step_anchor) != 1:
              raise SystemExit("touchStep anchor changed")
          text = text.replace(step_anchor, step_new, 1)

          jni_anchor = (
              "// Toolbar multi-select toggle: on = one finger draws the selection marquee;\n"
              "// off (default) = one finger pans the rack.\n"
              "extern \"C\" JNIEXPORT void JNICALL\n"
              "Java_org_rackdroid_MainActivity_nativeSetMultiSelect(JNIEnv*, jobject, jboolean on) {\n"
              "\tmultiSelect.store(on, std::memory_order_relaxed);\n"
              "}\n"
          )
          jni_new = jni_anchor + (
              "\n// Performance Touch: independent Android pointers can own independent controls.\n"
              "extern \"C\" JNIEXPORT void JNICALL\n"
              "Java_org_rackdroid_MainActivity_nativeSetPerformanceTouch(JNIEnv*, jobject, jboolean on) {\n"
              "\tperformanceTouch.store(on, std::memory_order_relaxed);\n"
              "}\n"
          )
          if text.count(jni_anchor) != 1:
              raise SystemExit("touch JNI anchor changed")
          text = text.replace(jni_anchor, jni_new, 1)

          cpp.write_text(text, encoding="utf-8")

          # Android JNI declaration.
          replace_once(
              "app/src/main/java/org/rackdroid/MainActivity.kt",
              "\tprivate external fun nativeSetMultiSelect(on: Boolean)\n"
              "\tprivate external fun nativeCopySelection()\n",
              "\tprivate external fun nativeSetMultiSelect(on: Boolean)\n"
              "\tprivate external fun nativeSetPerformanceTouch(on: Boolean)\n"
              "\tprivate external fun nativeCopySelection()\n",
              "MainActivity JNI")

          # Add a small persistent control beside the collapse handle instead of
          # growing the 8x2 tool grid to a third row.
          replace_once(
              "app/src/main/java/org/rackdroid/MainActivity.kt",
              "\t\tlateinit var collapseButton: ImageButton\n"
              "\t\tlateinit var card: LinearLayout\n",
              "\t\tlateinit var collapseButton: ImageButton\n"
              "\t\tlateinit var performanceButton: ImageButton\n"
              "\t\tlateinit var card: LinearLayout\n",
              "MainActivity performance declaration")

          replace_once(
              "app/src/main/java/org/rackdroid/MainActivity.kt",
              "\t\t\tcollapseButton.background = if (collapsed) glassPill() else amberRippleRounded()\n"
              "\t\t\tcollapseButton.contentDescription = getString(\n",
              "\t\t\tcollapseButton.background = if (collapsed) glassPill() else amberRippleRounded()\n"
              "\t\t\tperformanceButton.background = if (collapsed) glassPill() else amberRippleRounded()\n"
              "\t\t\tcollapseButton.contentDescription = getString(\n",
              "MainActivity collapsed styling")

          old_handle = (
              "\t\tval handleRow = LinearLayout(this).apply {\n"
              "\t\t\torientation = LinearLayout.HORIZONTAL\n"
              "\t\t\tgravity = Gravity.CENTER_HORIZONTAL\n"
              "\t\t\taddView(collapseButton, LinearLayout.LayoutParams(dp(64), dp(26)))\n"
              "\t\t}\n"
          )
          new_handle = (
              "\t\t// Performance Touch lives beside the fold handle instead of taking a\n"
              "\t\t// seventeenth grid slot. It stays reachable with the toolbar folded.\n"
              "\t\tvar performanceTouchOn = false\n"
              "\t\tnativeSetPerformanceTouch(false)\n"
              "\t\tperformanceButton = iconButton(\n"
              "\t\t\tR.drawable.ic_tb_performance_touch,\n"
              "\t\t\tgetString(R.string.toolbar_performance_touch)) { button ->\n"
              "\t\t\tperformanceTouchOn = !performanceTouchOn\n"
              "\t\t\tnativeSetPerformanceTouch(performanceTouchOn)\n"
              "\t\t\tbutton.imageTintList = if (performanceTouchOn) amberTint else iconTint\n"
              "\t\t\tbutton.alpha = if (performanceTouchOn) 1f else 0.6f\n"
              "\t\t}\n"
              "\t\tperformanceButton.alpha = 0.6f\n"
              "\t\tViewCompat.setTooltipText(\n"
              "\t\t\tperformanceButton,\n"
              "\t\t\tgetString(R.string.toolbar_performance_touch_hint))\n\n"
              "\t\tval handleRow = LinearLayout(this).apply {\n"
              "\t\t\torientation = LinearLayout.HORIZONTAL\n"
              "\t\t\tgravity = Gravity.CENTER_HORIZONTAL\n"
              "\t\t\taddView(performanceButton, LinearLayout.LayoutParams(dp(44), dp(30)).apply {\n"
              "\t\t\t\tsetMargins(0, 0, dp(4), 0)\n"
              "\t\t\t})\n"
              "\t\t\taddView(collapseButton, LinearLayout.LayoutParams(dp(64), dp(30)))\n"
              "\t\t}\n"
          )
          replace_once(
              "app/src/main/java/org/rackdroid/MainActivity.kt",
              old_handle, new_handle, "MainActivity handle row")

          replace_once(
              "app/src/main/res/values/strings.xml",
              '\t<string name="toolbar_lock_all">Lock all controls</string>\n'
              '\t<string name="toolbar_collapse">Collapse toolbar</string>\n',
              '\t<string name="toolbar_lock_all">Lock all controls</string>\n'
              '\t<string name="toolbar_performance_touch">Performance touch</string>\n'
              '\t<string name="toolbar_performance_touch_hint">Move multiple knobs, sliders, or switches at once; drag empty rack space to scroll.</string>\n'
              '\t<string name="toolbar_collapse">Collapse toolbar</string>\n',
              "performance strings")

          icon_text = (
              "<!-- Performance Touch: two independent fingers on two knobs -->\n"
              "<vector xmlns:android=\"http://schemas.android.com/apk/res/android\"\n"
              "\tandroid:width=\"24dp\" android:height=\"24dp\"\n"
              "\tandroid:viewportWidth=\"24\" android:viewportHeight=\"24\">\n"
              "\t<path\n"
              "\t\tandroid:fillColor=\"#00000000\"\n"
              "\t\tandroid:strokeColor=\"#ECECEC\"\n"
              "\t\tandroid:strokeWidth=\"1.8\"\n"
              "\t\tandroid:strokeLineCap=\"round\"\n"
              "\t\tandroid:strokeLineJoin=\"round\"\n"
              "\t\tandroid:pathData=\"M7,3 V8 M17,3 V8\" />\n"
              "\t<path\n"
              "\t\tandroid:fillColor=\"#00000000\"\n"
              "\t\tandroid:strokeColor=\"#ECECEC\"\n"
              "\t\tandroid:strokeWidth=\"1.8\"\n"
              "\t\tandroid:strokeLineCap=\"round\"\n"
              "\t\tandroid:strokeLineJoin=\"round\"\n"
              "\t\tandroid:pathData=\"M7,11 A4,4 0,1 1,6.99,19 A4,4 0,1 1,7,11 "
              "M17,11 A4,4 0,1 1,16.99,19 A4,4 0,1 1,17,11\" />\n"
              "\t<path\n"
              "\t\tandroid:fillColor=\"#00000000\"\n"
              "\t\tandroid:strokeColor=\"#ECECEC\"\n"
              "\t\tandroid:strokeWidth=\"1.8\"\n"
              "\t\tandroid:strokeLineCap=\"round\"\n"
              "\t\tandroid:pathData=\"M7,15 L8.7,13.3 M17,15 L15.3,13.3\" />\n"
              "</vector>\n"
          )
          Path("app/src/main/res/drawable/ic_tb_performance_touch.xml").write_text(
              icon_text, encoding="utf-8")

          print("Performance Touch source prepared")
          PY

      - name: Validate Performance Touch patch
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq 'static std::atomic<bool> performanceTouch{false};' native/port/touch_input.cpp
          grep -Fq 'PerfKind::SWITCH' native/port/touch_input.cpp
          grep -Fq 'handlePerformanceTouch(event, action, actionMasked, pointerCount)' native/port/touch_input.cpp
          grep -Fq 'nativeSetPerformanceTouch' native/port/touch_input.cpp
          grep -Fq 'nativeSetPerformanceTouch' app/src/main/java/org/rackdroid/MainActivity.kt
          grep -Fq 'ic_tb_performance_touch' app/src/main/java/org/rackdroid/MainActivity.kt
          grep -Fq 'toolbar_performance_touch_hint' app/src/main/res/values/strings.xml
          test -s app/src/main/res/drawable/ic_tb_performance_touch.xml

          git add -N app/src/main/res/drawable/ic_tb_performance_touch.xml
          git diff -- \
            native/port/touch_input.cpp \
            app/src/main/java/org/rackdroid/MainActivity.kt \
            app/src/main/res/values/strings.xml \
            app/src/main/res/drawable/ic_tb_performance_touch.xml \
            > RackDroid-Performance-Touch.patch
          test -s RackDroid-Performance-Touch.patch

          if grep -E 'audio_oboe|Oboe|frames/burst|buffer target|callback frame|sample-rate mode' \
              RackDroid-Performance-Touch.patch; then
            echo "ERROR: Performance Touch patch unexpectedly mentions audio-path code." >&2
            exit 1
          fi

      - name: Build development-signed Performance Touch APK
        run: >-
          ./gradlew assembleSideloadRelease
          -PdevKeystore -PtargetAbis=arm64-v8a --no-daemon

      - name: Package test build
        id: package
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/sideload/release/app-sideload-release.apk"
          test -s "${APK}"
          unzip -t "${APK}" >/dev/null

          SHORT_SHA="$(git rev-parse --short=7 HEAD)"
          OUT="RackDroid-performance-touch-${SHORT_SHA}.apk"
          cp "${APK}" "${OUT}"
          echo "apk=${OUT}" >> "${GITHUB_OUTPUT}"

          sha256sum "${OUT}" RackDroid-Performance-Touch.patch \
            > RackDroid-performance-touch-SHA256.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: RackDroid-performance-touch-${{ github.sha }}
          path: |
            ${{ steps.package.outputs.apk }}
            RackDroid-Performance-Touch.patch
            RackDroid-performance-touch-SHA256.txt
          if-no-files-found: error
