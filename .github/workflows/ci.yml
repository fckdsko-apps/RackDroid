# Minimal guard rail for a project whose bugs are mostly silent ones.
#
# Two independent jobs, cheapest first:
#   host  -- builds the engine + every plugin for x86_64 Linux and instantiates
#            AND renders every registered model (rack_ui_smoke --all-modules).
#            This is the check that actually catches plugin regressions, and it
#            needs no Android SDK, so it fails fast.
#   apk   -- builds the shipping arm64 APK, proving the NDK/CMake path and the
#            asset packing still work end to end.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  host:
    name: Host smoke test (all modules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build + Mesa dependencies
        run: |
          sudo apt-get update
          # libegl1-mesa-dev/libgles-dev: rack_ui_smoke renders through Mesa's
          # surfaceless EGL platform. xxd: Valley embeds its ROMs via `xxd -i`.
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build xxd \
            libegl1-mesa-dev libgles-dev libgl1-mesa-dri

      - name: Configure
        run: cmake -S native -B build-host-ui -G Ninja -DRACKDROID_HOST_UI=ON

      - name: Build
        run: cmake --build build-host-ui

      - name: Instantiate and render every registered model
        env:
          EGL_PLATFORM: surfaceless
          LIBGL_ALWAYS_SOFTWARE: "1"
        # A crash in any module's constructor or draw path fails the job.
        run: ./build-host-ui/rack_ui_smoke 30 --all-modules

  apk:
    name: Release APK (arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Build
        # -PdevKeystore: the private key is deliberately not in the repo, so CI
        # signs with the public development key. Never publish this artifact.
        run: ./gradlew assembleRelease -PdevKeystore --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: rackdroid-debugkey-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
