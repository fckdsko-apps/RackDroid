name: Build Recording Save As APK

on:
  workflow_dispatch:
  push:
    branches:
      - android-file-picker
    paths:
      - ".github/workflows/build-recording-save-as-apk.yml"

permissions:
  contents: read

jobs:
  build-arm64-apk:
    name: Build Recording Save As arm64 APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Verify RackDroid baseline
        shell: bash
        run: |
          set -euo pipefail
          BASELINE="fa197113b11b99dec57f9475cd44397bcb4c2304"
          test "${GITHUB_REF_NAME}" = "android-file-picker"
          git merge-base --is-ancestor "${BASELINE}" HEAD

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Add Recording Save As
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "import base64; exec(compile(base64.b64decode(''), '<recording-save-as>', 'exec'))"

      - name: Validate isolated Recording Save As changes
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'RecordingSaveActivity::class.java' app/src/main/java/org/rackdroid/MainActivity.kt
          grep -Fq 'Intent.ACTION_CREATE_DOCUMENT' app/src/main/java/org/rackdroid/RecordingSaveActivity.kt
          grep -Fq 'android:name=".RecordingSaveActivity"' app/src/main/AndroidManifest.xml
          grep -Fq 'toast_recording_saved_as' app/src/main/res/values/strings.xml

          git add -N app/src/main/java/org/rackdroid/RecordingSaveActivity.kt

          python3 <<'PY'
          import subprocess
          allowed = {
              "app/src/main/java/org/rackdroid/MainActivity.kt",
              "app/src/main/java/org/rackdroid/RecordingSaveActivity.kt",
              "app/src/main/AndroidManifest.xml",
              "app/src/main/res/values/strings.xml",
          }
          changed = set(
              subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          )
          if changed != allowed:
              print("ERROR: unexpected changed-file set")
              print("Expected:", sorted(allowed))
              print("Actual:", sorted(changed))
              raise SystemExit(1)
          print("Source isolation passed: no native/audio files changed.")
          PY

          git diff --check
          git diff --             app/src/main/java/org/rackdroid/MainActivity.kt             app/src/main/java/org/rackdroid/RecordingSaveActivity.kt             app/src/main/AndroidManifest.xml             app/src/main/res/values/strings.xml             > RackDroid-Recording-Save-As.patch
          test -s RackDroid-Recording-Save-As.patch

      - name: Build development-signed Recording Save As APK
        run: >-
          ./gradlew assembleSideloadRelease
          -PdevKeystore -PtargetAbis=arm64-v8a --no-daemon

      - name: Package test build
        id: package
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/sideload/release/app-sideload-release.apk"
          test -s "${APK}"
          unzip -t "${APK}" >/dev/null

          SHORT_SHA="$(git rev-parse --short=7 HEAD)"
          OUT="RackDroid-recording-save-as-${SHORT_SHA}.apk"
          cp "${APK}" "${OUT}"
          echo "apk=${OUT}" >> "${GITHUB_OUTPUT}"

          sha256sum "${OUT}" RackDroid-Recording-Save-As.patch             > RackDroid-recording-save-as-SHA256.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: RackDroid-recording-save-as-${{ github.sha }}
          path: |
            ${{ steps.package.outputs.apk }}
            RackDroid-Recording-Save-As.patch
            RackDroid-recording-save-as-SHA256.txt
          if-no-files-found: error
